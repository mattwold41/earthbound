# ============================================================
# EARTHBOUND DEVELOPMENT DIAGNOSTICS
# ============================================================

diagnostics:

  # Searches for six potential Friends Alpha home locations.
  #
  # Requires successfully loaded:
  #
  # - Terrain elevation data
  # - Water classification data
  # - Real-world road data
  # - Smoothed road elevation profiles
  # - Road spatial index
  #
  # Reports candidate property coordinates in the console.
  #
  # Does not:
  #
  # - Construct houses
  # - Modify terrain
  # - Generate chunks
  # - Register property ownership
  # - Automatically update this configuration
  #
  # Residential development must remain disabled.
  #
  # Keep disabled during normal server operation.

  residential-site-search: false
