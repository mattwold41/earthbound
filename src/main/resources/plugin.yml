name: EarthBound
version: 0.1.0
main: com.earthbound.EarthBound
load: STARTUP
api-version: '26.2'

description: Real Earth simulation server for Minecraft
author: EarthBound


commands:

  earth:
    description: EarthBound commands
    usage: /earth locate
    permission: earthbound.locate


  balance:
    description: View your EarthBound money balance
    usage: /balance


  store:
    description: EarthBound Store
    usage: /store



permissions:

  earthbound.locate:
    description: Allows use of /earth locate
    default: true
