name: EarthBound
version: 0.1.0
main: com.earthbound.EarthBound
load: STARTUP
api-version: '26.2'

description: Real Earth simulation server for Minecraft
author: EarthBound

commands:

  earth:
    description: EarthBound commands
    usage: /earth locate
    permission: earthbound.locate

  balance:
    description: View your EarthBound money balance
    usage: /balance

  pay:
    description: Transfer money to another player
    usage: /pay <player> <amount>

  store:
    description: EarthBound General Store
    usage: /store

  earthbank:
    description: Manage EarthBound government treasury accounts
    usage: /earthbank
    permission: earthbound.bank.admin

permissions:

  earthbound.locate:
    description: Allows use of /earth locate
    default: true

  earthbound.bank.admin:
    description: Allows management of government treasury accounts
    default: op
