name: Build EarthBound

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: gradle build

      - name: Upload EarthBound JAR
        uses: actions/upload-artifact@v4
        with:
          name: EarthBound
          path: build/libs/EarthBound-*.jar
